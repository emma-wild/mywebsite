<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Десяточка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Layout idea: one-screen game. Equation on top, a ten-frame (2x5) in the middle, big 1-9 keypad below. */
  :root {
    --paper: #F3F0FB;
    --card: #FFFFFF;
    --ink: #1D1A3B;
    --muted: #6B6890;
    --line: #CFC9EA;
    --fill: #FF7A1A;
    --gap: #1FA3E8;
    --good: #17A367;
    --bad: #E5484D;
    --font-d: 'Rubik', system-ui, sans-serif;
    --font-b: 'Nunito', system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14122B;
      --card: #211E47;
      --ink: #F2F0FF;
      --muted: #A5A1CC;
      --line: #3D3978;
      --good: #3DD598;
      --bad: #FF6B70;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14122B;
    --card: #211E47;
    --ink: #F2F0FF;
    --muted: #A5A1CC;
    --line: #3D3978;
    --good: #3DD598;
    --bad: #FF6B70;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-b);
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 440px;
    min-height: 100%;
    margin: 0 auto;
    padding: 14px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--gap); outline-offset: 2px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 {
    margin: 0;
    font-family: var(--font-d);
    font-weight: 800;
    font-size: 24px;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--fill); }
  .tools { display: flex; gap: 8px; }
  .tog {
    border: 2px solid var(--line);
    background: transparent;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 14px;
    color: var(--muted);
  }
  .tog[aria-pressed="true"] { background: var(--gap); border-color: var(--gap); color: #fff; }

  .progress { display: flex; align-items: center; gap: 10px; }
  .track { flex: 1; height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--fill); border-radius: 999px; transition: width .4s ease; }
  #count { font-family: var(--font-d); font-weight: 700; font-size: 14px; color: var(--muted); min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }

  #game { display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .eq {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-family: var(--font-d); font-weight: 800;
    font-size: clamp(44px, 14vw, 62px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    padding-top: 4px;
  }
  .eq .op { color: var(--muted); font-weight: 700; }
  .slot {
    min-width: 1.15em; height: 1.25em;
    display: inline-flex; align-items: center; justify-content: center;
    border: 3px dashed var(--gap); border-radius: 16px;
    color: var(--gap);
  }
  .slot.good { border-style: solid; border-color: var(--good); color: var(--good); animation: pop .35s ease; }

  .frame {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    width: 100%; max-width: 340px; margin: 0 auto;
    padding: 10px; background: var(--card); border-radius: 22px;
    border: 2px solid var(--line);
  }
  .cell {
    aspect-ratio: 1; border-radius: 14px;
    border: 2px solid var(--line);
    display: grid; place-items: center;
  }
  .dot { width: 72%; height: 72%; border-radius: 50%; }
  .dot.fill { background: var(--fill); }
  .dot.gap { background: var(--gap); animation: pop .4s ease both; }

  .feedback { min-height: 26px; text-align: center; font-size: 18px; color: var(--muted); }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: auto; }
  .key {
    height: 70px; border-radius: 18px;
    border: 2px solid var(--line); border-bottom-width: 6px;
    background: var(--card);
    font-family: var(--font-d); font-weight: 700; font-size: 34px;
    transition: transform .08s ease;
  }
  .key:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 3px; }
  .key.good { background: var(--good); border-color: var(--good); color: #fff; }
  .key.bad { background: transparent; border-color: var(--bad); color: var(--bad); opacity: .55; animation: shake .35s ease; }
  .key:disabled { cursor: default; }

  #done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
  .stars { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 320px; }
  .star { font-size: 38px; line-height: 1; color: var(--line); }
  .star.on { color: var(--fill); animation: pop .4s ease both; }
  #done h2 { margin: 0; font-family: var(--font-d); font-weight: 800; font-size: 36px; }
  #done p { margin: 0; font-size: 20px; color: var(--muted); }
  .again {
    border: 0; border-bottom: 6px solid #C85A0A; border-radius: 18px;
    background: var(--fill); color: #fff;
    font-family: var(--font-d); font-weight: 800; font-size: 26px;
    padding: 14px 36px;
  }
  .again:active { transform: translateY(3px); border-bottom-width: 3px; }

  [hidden] { display: none !important; }

  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (max-height: 640px) {
    .key { height: 56px; font-size: 28px; }
    .frame { max-width: 280px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Десяточ<span>ка</span></h1>
    <div class="tools">
      <button class="tog" id="hintBtn" type="button" aria-pressed="true">Подсказка</button>
      <button class="tog" id="soundBtn" type="button" aria-pressed="true">Звук</button>
    </div>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="track"><div id="bar"></div></div>
    <div id="count">1 / 10</div>
  </div>

  <section id="game">
    <div class="eq" id="eq" aria-live="polite"></div>
    <div class="frame" id="frame" aria-hidden="true"></div>
    <div class="feedback" id="feedback" aria-live="polite">Сколько не хватает до десяти?</div>
    <div class="pad" id="pad"></div>
  </section>

  <section id="done" hidden>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <h2 id="doneTitle"></h2>
    <p id="doneText"></p>
    <button class="again" id="again" type="button">Ещё раз</button>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var S = { queue: [], i: 0, hint: true, sound: true };
  var busy = false, revealed = false, ac = null;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function newRound() {
    var nums = [1, 2, 3, 4, 5, 6, 7, 8, 9];
    nums.push(1 + Math.floor(Math.random() * 9));
    var tries = 0, ok = false;
    while (!ok && tries < 60) {
      shuffle(nums);
      ok = true;
      for (var i = 1; i < nums.length; i++) if (nums[i] === nums[i - 1]) ok = false;
      tries++;
    }
    S.queue = nums.map(function (a) { return { a: a, left: Math.random() < 0.65 }; });
    S.i = 0;
  }

  function tone(f, d, type, when) {
    if (!S.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var t0 = ac.currentTime + (when || 0);
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.15, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0 + d + 0.05);
    } catch (e) {}
  }

  function save() {
    try {
      localStorage.setItem('des-hint', S.hint ? '1' : '0');
      localStorage.setItem('des-sound', S.sound ? '1' : '0');
    } catch (e) {}
  }

  function cur() { return S.queue[S.i]; }

  function drawFrame(popGap) {
    var q = cur(); if (!q) return;
    var showFilled = S.hint || revealed || q.missed;
    var html = '';
    for (var k = 0; k < 10; k++) {
      var dot = '';
      if (k < q.a) {
        if (showFilled) dot = '<span class="dot fill"></span>';
      } else if (revealed) {
        dot = '<span class="dot gap" style="animation-delay:' + ((k - q.a) * 70) + 'ms"></span>';
      }
      html += '<div class="cell">' + dot + '</div>';
    }
    $('frame').innerHTML = html;
  }

  function drawEq(solved) {
    var q = cur(); if (!q) return;
    var need = 10 - q.a;
    var slot = '<span class="slot' + (solved ? ' good' : '') + '">' + (solved ? need : '?') + '</span>';
    var a = '<span>' + q.a + '</span>';
    $('eq').innerHTML = (q.left ? a + '<span class="op">+</span>' + slot : slot + '<span class="op">+</span>' + a) +
      '<span class="op">=</span><span>10</span>';
  }

  function setFeedback(text, cls) {
    var f = $('feedback');
    f.textContent = text;
    f.className = 'feedback' + (cls ? ' ' + cls : '');
  }

  function render() {
    var done = S.i >= S.queue.length;
    $('game').hidden = done;
    $('done').hidden = !done;
    $('bar').style.width = (S.i / S.queue.length * 100) + '%';
    $('count').textContent = Math.min(S.i + 1, S.queue.length) + ' / ' + S.queue.length;
    $('hintBtn').setAttribute('aria-pressed', String(S.hint));
    $('soundBtn').setAttribute('aria-pressed', String(S.sound));
    if (done) { showDone(); return; }
    revealed = false; busy = false;
    drawEq(false);
    drawFrame();
    setFeedback('Сколько не хватает до десяти?', '');
    var keys = $('pad').children;
    for (var i = 0; i < keys.length; i++) { keys[i].disabled = false; keys[i].className = 'key'; }
  }

  function showDone() {
    var originals = S.queue.filter(function (q) { return !q.retried; });
    var good = originals.filter(function (q) { return !q.missed; }).length;
    var html = '';
    for (var i = 0; i < originals.length; i++) {
      html += '<span class="star' + (i < good ? ' on' : '') + '" style="animation-delay:' + (i * 90) + 'ms">★</span>';
    }
    $('stars').innerHTML = html;
    var t = good >= 9 ? 'Отлично!' : good >= 6 ? 'Хорошо!' : 'Почти получилось!';
    var p = good >= 9 ? 'Ты знаешь состав десяти.' : good >= 6 ? 'Сыграем ещё раз, и будет ещё лучше.' : 'Давай попробуем ещё раз.';
    $('doneTitle').textContent = t;
    $('doneText').textContent = good + ' из ' + originals.length + ' с первого раза. ' + p;
    if (good >= 6) { tone(523, .15); tone(659, .15, 'sine', .15); tone(784, .3, 'sine', .3); }
  }

  function next() {
    var q = cur();
    if (q.missed && !q.retried) S.queue.push({ a: q.a, left: q.left, retried: true });
    S.i++;
    render();
  }

  function answer(n) {
    if (busy) return;
    var q = cur(); if (!q) return;
    var btn = $('pad').children[n - 1];
    if (btn.disabled) return;
    if (n === 10 - q.a) {
      busy = true; revealed = true;
      btn.classList.add('good');
      drawEq(true);
      drawFrame();
      setFeedback('Верно! ' + q.a + ' и ' + n + ' — это 10', 'good');
      tone(660, .15); tone(880, .22, 'sine', .12);
      setTimeout(next, 1400);
    } else {
      q.missed = true;
      btn.disabled = true;
      btn.className = 'key bad';
      drawFrame();
      setFeedback('Посмотри на пустые клетки. Попробуй ещё.', 'bad');
      tone(220, .22, 'triangle');
    }
  }

  function bind() {
    var pad = $('pad'), html = '';
    for (var n = 1; n <= 9; n++) html += '<button class="key" type="button" data-n="' + n + '" aria-label="' + n + '">' + n + '</button>';
    pad.innerHTML = html;
    pad.addEventListener('click', function (e) {
      var b = e.target.closest('.key');
      if (b) answer(Number(b.getAttribute('data-n')));
    });
    document.addEventListener('keydown', function (e) {
      if (e.key >= '1' && e.key <= '9') answer(Number(e.key));
    });
    $('hintBtn').addEventListener('click', function () {
      S.hint = !S.hint; save();
      $('hintBtn').setAttribute('aria-pressed', String(S.hint));
      drawFrame();
    });
    $('soundBtn').addEventListener('click', function () {
      S.sound = !S.sound; save();
      $('soundBtn').setAttribute('aria-pressed', String(S.sound));
      tone(660, .1);
    });
    $('again').addEventListener('click', function () { newRound(); render(); });
  }

  function start(data) {
    try {
      var h = localStorage.getItem('des-hint'); if (h !== null) S.hint = h === '1';
      var s = localStorage.getItem('des-sound'); if (s !== null) S.sound = s === '1';
    } catch (e) {}
    if (data && data.queue && data.queue.length) {
      S.queue = data.queue; S.i = data.i || 0;
      if (typeof data.hint === 'boolean') S.hint = data.hint;
      if (typeof data.sound === 'boolean') S.sound = data.sound;
    } else {
      newRound();
    }
    bind();
    render();
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      window.claude.hot.snapshot(function () {
        return { queue: S.queue, i: S.i, hint: S.hint, sound: S.sound };
      });
    }
  }

  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start(window.claude && window.claude.hot ? window.claude.hot.data : null);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Через десяток</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  /* Layout idea: two ten-frames (UK "double ten frame"), a written record that grows step by step, and answer buttons at the bottom. */
  :root {
    --paper: #F3F0FB;
    --card: #FFFFFF;
    --ink: #1D1A3B;
    --muted: #6B6890;
    --line: #CFC9EA;
    --c0: #FF7A1A;
    --c1: #1FA3E8;
    --want: #17A367;
    --good: #17A367;
    --bad: #E5484D;
    --font-d: 'Rubik', system-ui, sans-serif;
    --font-b: 'Nunito', system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14122B; --card: #211E47; --ink: #F2F0FF; --muted: #A5A1CC; --line: #3D3978;
      --want: #3DD598; --good: #3DD598; --bad: #FF6B70; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14122B; --card: #211E47; --ink: #F2F0FF; --muted: #A5A1CC; --line: #3D3978;
    --want: #3DD598; --good: #3DD598; --bad: #FF6B70; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--font-b); font-weight: 700;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 460px; min-height: 100%; margin: 0 auto;
    padding: 12px 16px 18px; display: flex; flex-direction: column; gap: 12px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--c1); outline-offset: 2px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { margin: 0; font-family: var(--font-d); font-weight: 800; font-size: 22px; }
  h1 span { color: var(--c0); }
  .hdr-right { display: flex; align-items: center; gap: 10px; }
  #count { font-family: var(--font-d); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tog {
    border: 2px solid var(--line); background: transparent; border-radius: 999px;
    padding: 5px 12px; font-size: 14px; color: var(--muted);
  }
  .tog[aria-pressed="true"] { background: var(--c1); border-color: var(--c1); color: #fff; }

  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .step {
    display: flex; align-items: center; gap: 6px; padding: 6px 6px;
    border-radius: 12px; border: 2px solid var(--line); color: var(--muted);
    font-size: 12px; line-height: 1.1;
  }
  .step b {
    flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    background: var(--line); color: var(--card); font-family: var(--font-d); font-size: 13px;
  }
  .step.on { border-color: var(--ink); color: var(--ink); }
  .step.on b { background: var(--ink); }
  .step.ok { border-color: var(--good); color: var(--good); }
  .step.ok b { background: var(--good); }

  .record {
    background: var(--card); border: 2px solid var(--line); border-radius: 18px;
    padding: 10px 14px; display: flex; flex-direction: column; gap: 2px;
    font-family: var(--font-d); font-variant-numeric: tabular-nums;
  }
  .rec-main { font-size: 40px; font-weight: 800; line-height: 1.1; text-align: center; }
  .rec-main .op, .rec-line .op { color: var(--muted); font-weight: 500; }
  .rec-main .hl { text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 6px; }
  .rg {
    display: grid; grid-template-columns: 1fr auto auto auto auto auto 1fr;
    align-items: center; column-gap: 8px; row-gap: 2px;
    font-family: var(--font-d); font-variant-numeric: tabular-nums;
  }
  .rg .r1 { font-size: 40px; font-weight: 800; line-height: 1.15; }
  .rg .r2 { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .rg .nm { justify-self: end; }
  .rg .o { justify-self: center; color: var(--muted); font-weight: 500; }
  .rg .hl { text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 6px; }
  .rg .wh { color: var(--ink); }
  .res-cell { position: relative; justify-self: start; }
  .hand-res {
    position: absolute; left: -2px; top: -9px; white-space: nowrap; pointer-events: none;
    display: inline-block; font-family: 'Caveat', 'Comic Sans MS', cursive; font-weight: 700;
    font-size: 64px; line-height: .8; color: var(--good);
    transform: rotate(-6deg);
    animation: write .7s ease-out both, glow 1.1s ease .6s both;
  }
  .tail { justify-self: start; }
  .colplus { color: var(--ink); position: relative; top: -0.6em; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes glow {
    0% { transform: rotate(-6deg) scale(1); text-shadow: none; }
    35% { transform: rotate(-6deg) scale(1.3); text-shadow: 0 0 8px #FFD600, 0 0 22px rgba(255,214,0,.85), 0 0 40px rgba(255,214,0,.5); }
    100% { transform: rotate(-6deg) scale(1); text-shadow: 0 0 10px rgba(255,214,0,.25); }
  }
  .col {
    display: grid; grid-template-columns: 1fr auto 30px 1fr; align-items: baseline;
    font-size: 24px; font-weight: 700; row-gap: 2px;
  }
  .c-l { text-align: right; padding-right: 8px; animation: pop .35s ease both; }
  .c-v { text-align: right; min-width: 2ch; position: relative; animation: pop .35s ease both; color: var(--ink); }
  .c-p { text-align: center; color: var(--ink); position: relative; top: -0.55em; }
  .c-v.line, .c-p.line { border-bottom: 3px solid var(--ink); }
  .c-v.line { animation: none; }
  .hand {
    position: absolute; right: -22px; top: 100%; margin-top: 2px;
    font-family: 'Caveat', 'Comic Sans MS', cursive; font-weight: 700;
    font-size: 76px; line-height: .9; color: var(--good);
    transform: rotate(-7deg);
    text-shadow: 0 0 6px var(--paper), 0 0 3px var(--paper), 0 0 2px var(--paper);
    white-space: nowrap; pointer-events: none;
    animation: write .9s ease-out both .15s;
  }
  .k0 { color: var(--c0); }
  .k1 { color: var(--c1); }
  .gr { color: var(--muted); opacity: .75; }
  .res { color: var(--good); }

  .eq {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-family: var(--font-d); font-weight: 800; font-size: 46px; line-height: 1;
    font-variant-numeric: tabular-nums; min-height: 60px;
  }
  .eq .op { color: var(--muted); font-weight: 500; }
  .box {
    width: 1.3em; height: 1.3em; border: 4px solid var(--ink); border-radius: 10px;
    display: inline-grid; place-items: center;
  }
  .box.filled { border-color: var(--good); color: var(--good); }
  .box.filled span { animation: pop .3s ease both; }

  .frames { position: relative; }
  .bwrap { position: relative; flex: none; width: 48px; }
  .was {
    position: absolute; left: 0; right: 0; top: -24px; text-align: center;
    font-family: var(--font-d); font-size: 18px; color: var(--muted);
    text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 3px;
  }
  .badge.flash { animation: flash .6s ease; }
  .bplus {
    position: absolute; left: 0; width: 48px; top: calc(50% - 22px); transform: translateY(-50%);
    text-align: center; font-family: var(--font-d); font-weight: 800; font-size: 30px; color: var(--ink);
    line-height: 1; animation: pop .35s ease both;
  }

  .frames { display: flex; flex-direction: column; gap: 10px; }
  .frow { display: flex; align-items: center; gap: 10px; }
  .badge {
    flex: none; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
    font-family: var(--font-d); font-weight: 800; font-size: 26px; color: #fff;
  }
  .badge.k0 { background: var(--c0); }
  .badge.k1 { background: var(--c1); }
  .frame {
    flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    padding: 8px; background: var(--card); border-radius: 18px; border: 3px solid var(--line);
    max-width: 320px; transition: border-color .2s ease;
  }
  .frame.big { border-color: var(--ink); }
  .cell {
    aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--line);
    display: grid; place-items: center; padding: 0;
    background: transparent;
  }
  .cell.want { border: 2px dashed var(--want); background: color-mix(in srgb, var(--want) 12%, transparent); }
  .dot { width: 74%; height: 74%; border-radius: 50%; display: block; }
  .dot.k0 { background: var(--c0); }
  .dot.k1 { background: var(--c1); }
  .dot.arrived { animation: pop .35s ease both; box-shadow: 0 0 0 3px var(--card), 0 0 0 5px currentColor; }
  .dot.arrived.k0 { color: var(--c0); }
  .dot.arrived.k1 { color: var(--c1); }
  .cell.tap { cursor: pointer; border-color: currentColor; }
  .cell.tap .dot { animation: wiggle 1.4s ease-in-out infinite; }
  .cell.tap:active .dot { transform: scale(.85); }

  .prompt { text-align: center; font-size: 19px; line-height: 1.3; min-height: 50px; display: grid; place-items: center; }
  .prompt.good { color: var(--good); }
  .prompt.bad { color: var(--bad); }

  .choices { display: flex; gap: 10px; justify-content: center; margin-top: auto; }
  .choice {
    flex: 1; max-width: 130px; height: 72px; border-radius: 18px;
    border: 2px solid var(--line); border-bottom-width: 6px; background: var(--card);
    font-family: var(--font-d); font-weight: 800; font-size: 34px;
  }
  .choice:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 3px; }
  .choice.k0 { background: var(--c0); border-color: #C85A0A; color: #fff; }
  .choice.k1 { background: var(--c1); border-color: #137BB3; color: #fff; }
  .choice.bad { background: transparent !important; border-color: var(--bad) !important; color: var(--bad) !important; opacity: .55; animation: shake .35s ease; }
  .choice:disabled { cursor: default; }
  .next {
    flex: 1; max-width: 280px; height: 64px; border: 0; border-radius: 18px;
    border-bottom: 6px solid #0F7A4C; background: var(--good); color: #fff;
    font-family: var(--font-d); font-weight: 800; font-size: 24px;
  }
  .next:active { transform: translateY(3px); border-bottom-width: 3px; }

  .nline { width: 100%; max-width: 380px; margin: 0 auto; display: block; }
  .nline text { font-family: var(--font-d); fill: var(--ink); }

  #done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
  .stars { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
  .star { font-size: 38px; line-height: 1; color: var(--line); }
  .star.on { color: var(--c0); animation: pop .4s ease both; }
  #done h2 { margin: 0; font-family: var(--font-d); font-weight: 800; font-size: 34px; }
  #done p { margin: 0; font-size: 19px; color: var(--muted); max-width: 30ch; }

  [hidden] { display: none !important; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes flash {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    30% { transform: scale(1.3); box-shadow: 0 0 0 8px rgba(255,214,0,.85), 0 0 24px 10px rgba(255,214,0,.6); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,214,0,0); }
  }
  @keyframes write { from { clip-path: inset(-40px 100% -40px -40px); } to { clip-path: inset(-40px -40px -40px -40px); } }
  @keyframes wiggle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-height: 700px) {
    .rec-main { font-size: 32px; } .rec-line { font-size: 18px; }
    .choice { height: 58px; font-size: 28px; } .frame { max-width: 260px; }
  }
  /* Tighter spacing around the question equation only */
  .prompt { min-height: 0; }
  .eq { min-height: 0; margin: -8px 0 -2px; line-height: .95; font-size: 40px; }
  #game { gap: 9px !important; }
  .nline { max-width: 340px; margin: -10px auto -4px; }
  .next { height: 52px; font-size: 22px; }
  #app { padding-bottom: 8px; }
  .box { width: 1.15em; height: 1.15em; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Через десят<span>ок</span></h1>
    <div class="hdr-right">
      <span id="count">1 / 8</span>
      <button class="tog" id="soundBtn" type="button" aria-pressed="true">Звук</button>
    </div>
  </header>

  <div class="steps" id="steps">
    <div class="step"><b>1</b>Большее</div>
    <div class="step"><b>2</b>Не хватает</div>
    <div class="step"><b>3</b>Отдай</div>
    <div class="step"><b>4</b>Сложи</div>
  </div>

  <section id="game" style="display:flex;flex-direction:column;gap:12px;flex:1">
    <div class="record" id="record" aria-live="polite"></div>
    <div class="frames" id="frames"></div>
    <div class="prompt" id="prompt" aria-live="polite"></div>
    <div class="eq" id="eq" aria-live="polite"></div>
    <div class="choices" id="choices"></div>
  </section>

  <section id="done" hidden>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <h2 id="doneTitle"></h2>
    <p id="doneText"></p>
    <button class="next" id="again" type="button">Ещё раз</button>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ROUND = 8;
  var S = { queue: [], i: 0, sound: true };
  var P = null;      // state of the current problem
  var ac = null;

  function rnd(n) { return Math.floor(Math.random() * n); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function newRound() {
    var out = [], seen = {};
    while (out.length < ROUND) {
      var a = 2 + rnd(8), b = 2 + rnd(8);
      if (a + b <= 10 || seen[a + '+' + b]) continue;
      seen[a + '+' + b] = 1;
      out.push({ a: a, b: b });
    }
    S.queue = out; S.i = 0;
  }

  function tone(f, d, type, when) {
    if (!S.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var t0 = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.05);
    } catch (e) {}
  }
  var ding = function () { tone(660, .14); tone(880, .2, 'sine', .1); };
  var buzz = function () { tone(220, .22, 'triangle'); };

  function q() { return S.queue[S.i]; }
  function nums() { return [q().a, q().b]; }
  function info() {
    var n = nums(), bi = P.big, si = 1 - bi;
    var big = n[bi], small = n[si], need = 10 - big;
    return { n: n, bi: bi, si: si, big: big, small: small, need: need, rem: small - need, sum: big + small };
  }
  function k(i) { return 'k' + i; }

  function startProblem() { P = { phase: 1, big: null, moved: 0, msg: null, cls: '', wrong: {} }; render(); }

  /* ---------- rendering ---------- */

  function renderSteps() {
    var map = { 1: 1, 2: 2, '3m': 3, '3r': 3, 4: 4, end: 5 };
    var cur = map[P.phase], els = $('steps').children;
    for (var i = 0; i < 4; i++) els[i].className = 'step' + (i + 1 < cur ? ' ok' : i + 1 === cur ? ' on' : '');
  }

  function renderRecord() {
    var n = nums(), end = P.phase === 'end';
    var c = function (cls, txt) { return '<div class="' + cls + '">' + (txt == null ? '' : txt) + '</div>'; };
    var num = function (row, cls, v) { return c(row + ' nm', '<span class="' + cls + '">' + v + '</span>'); };
    var op = function (row, s) { return c(row + ' o', s); };

    var h = '<div class="rg">';
    // row 1: the original example
    h += '<div></div>' +
      num('r1', k(0) + (P.big === 0 ? ' hl' : ''), n[0]) + op('r1', '+') +
      num('r1', k(1) + (P.big === 1 ? ' hl' : ''), n[1]) +
      op('r1', '=') +
      c('r1 nm res-cell', '<span class="gr"' + (end ? ' style="visibility:hidden"' : '') + '>?</span>' +
        (end ? '<span class="hand-res">' + (n[0] + n[1]) + '</span>' : '')) +
      c('r1 tail', '');
    if (P.big !== null) {
      var I = info();
      var after2 = P.phase === '3m' || P.phase === '3r' || P.phase === 4 || end;
      var after3 = P.phase === 4 || end;
      if (after2) {
        h += '<div></div>' + num('r2', k(I.bi), I.big) + op('r2', '+') + num('r2', 'gr', I.need) + op('r2', '=') +
          num('r2', 'wh', 10) + '<div></div>';
      }
      if (after3) {
        h += '<div></div>' + num('r2', k(I.si), I.small) + op('r2', '=') + num('r2', 'gr', I.need) + op('r2', '+') +
          num('r2', 'wh', I.rem) + c('r2 tail colplus', '+');
      }
    }
    h += '</div>';
    $('record').innerHTML = h;
  }

  function renderFrames() {
    var n = nums(), I = P.big !== null ? info() : null, h = '';
    for (var f = 0; f < 2; f++) {
      var cells = '', isBig = I && f === I.bi, isSmall = I && f === I.si;
      for (var c = 0; c < 10; c++) {
        var cls = 'cell', inner = '', attr = '';
        if (isBig) {
          if (c < n[f]) inner = '<span class="dot ' + k(f) + '"></span>';
          else if (c < n[f] + P.moved) inner = '<span class="dot ' + k(I.si) + ' arrived"></span>';
          else if (P.phase === 2 || P.phase === '3m') cls += ' want';
        } else if (isSmall) {
          var left = n[f] - P.moved;
          if (c < left) {
            inner = '<span class="dot ' + k(f) + '"></span>';
            if (P.phase === '3m') { cls += ' tap ' + k(f); attr = ' data-move="1" aria-label="Перенести кружок"'; }
          }
        } else if (c < n[f]) inner = '<span class="dot ' + k(f) + '"></span>';
        cells += (attr ? '<button type="button" class="' + cls + '"' + attr + '>' : '<div class="' + cls + '">') + inner + (attr ? '</button>' : '</div>');
      }
      var cnt = isBig ? n[f] + P.moved : isSmall ? n[f] - P.moved : n[f];
      var changed = cnt !== n[f];
      h += '<div class="frow"><div class="bwrap">' + (changed ? '<span class="was">' + n[f] + '</span>' : '') +
        '<div class="badge ' + k(f) + (changed && P.flash ? ' flash' : '') + '">' + cnt + '</div></div>' +
        '<div class="frame' + (isBig ? ' big' : '') + '">' + cells + '</div></div>';
    }
    if (P.phase === 4 || P.phase === 'end') h += '<div class="bplus" aria-hidden="true">+</div>';
    $('frames').innerHTML = h;
    P.flash = false;
  }

  function options(x, lo, hi) {
    var set = [x], cand = shuffle([x - 1, x + 1, x - 2, x + 2]);
    for (var i = 0; i < cand.length && set.length < 3; i++) if (cand[i] >= lo && cand[i] <= hi && set.indexOf(cand[i]) < 0) set.push(cand[i]);
    while (set.length < 3) { var r = lo + rnd(hi - lo + 1); if (set.indexOf(r) < 0) set.push(r); }
    return set.sort(function (a, b) { return a - b; });
  }

  function numberLine(I) {
    var lo = I.big, hi = I.sum, W = 360, pad = 24, y = 86, span = hi - lo;
    var x = function (v) { return pad + (v - lo) * (W - 2 * pad) / span; };
    var col = I.si === 0 ? 'var(--c0)' : 'var(--c1)';
    var s = '<svg class="nline" viewBox="0 18 ' + W + ' 98" role="img" aria-label="Числовая прямая: от ' + I.big + ' до 10, потом до ' + I.sum + '">';
    s += '<line x1="' + (pad - 10) + '" y1="' + y + '" x2="' + (W - pad + 10) + '" y2="' + y + '" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/>';
    for (var v = lo; v <= hi; v++) {
      var key = v === lo || v === 10 || v === hi;
      s += '<line x1="' + x(v) + '" y1="' + (y - 7) + '" x2="' + x(v) + '" y2="' + (y + 7) + '" stroke="var(--muted)" stroke-width="2"/>';
      s += '<text x="' + x(v) + '" y="' + (y + 26) + '" text-anchor="middle" font-size="' + (key ? 17 : 12) + '" font-weight="' + (key ? 800 : 500) + '"' + (key ? '' : ' style="fill:var(--muted)"') + '>' + v + '</text>';
    }
    var arc = function (a, b, label) {
      var x1 = x(a), x2 = x(b), mx = (x1 + x2) / 2, top = y - 18 - Math.min(30, (x2 - x1) * 0.45);
      return '<path d="M' + x1 + ' ' + (y - 6) + ' Q' + mx + ' ' + top + ' ' + x2 + ' ' + (y - 6) + '" fill="none" stroke="' + col + '" stroke-width="3.5"/>' +
        '<text x="' + mx + '" y="' + (top + 2) + '" text-anchor="middle" font-size="16" font-weight="800" style="fill:' + col + '">+' + label + '</text>';
    };
    s += arc(lo, 10, I.need) + arc(10, hi, I.rem) + '</svg>';
    return s;
  }

  function renderBottom() {
    var n = nums(), msg = P.msg, html = '', I = P.big !== null ? info() : null;
    if (!msg) {
      if (P.phase === 1) msg = 'Шаг 1. Какое число больше?';
      else if (P.phase === 2) msg = 'Шаг 2. Сколько не хватает числу ' + I.big + ' до 10?';
      else if (P.phase === '3m') msg = 'Шаг 3. Отдай ' + I.need + ' от числа ' + I.small + '. Нажимай на кружки внизу.' ;
      else if (P.phase === '3r') msg = 'Сколько осталось у числа ' + I.small + '?';
      else if (P.phase === 4) msg = 'Шаг 4. Сколько будет 10 и ещё ' + I.rem + '?';
      else msg = '';
    }
    var pr = $('prompt');
    pr.textContent = msg; pr.className = 'prompt' + (P.cls ? ' ' + P.cls : '');

    if (P.phase === 1) {
      for (var i = 0; i < 2; i++) html += '<button type="button" class="choice ' + (P.wrong['b' + i] ? 'bad' : k(i)) + '" data-big="' + i + '"' + (P.wrong['b' + i] ? ' disabled' : '') + '>' + n[i] + '</button>';
    } else if (P.phase === 2 || P.phase === '3r' || P.phase === 4) {
      var ans = P.phase === 2 ? I.need : P.phase === '3r' ? I.rem : I.sum;
      var lo = P.phase === 4 ? 10 : 0, hi = P.phase === 4 ? 19 : 9;
      if (!P.opts) P.opts = options(ans, lo, hi);
      P.opts.forEach(function (v) {
        var w = P.wrong['v' + v];
        html += '<button type="button" class="choice' + (w ? ' bad' : '') + '" data-v="' + v + '"' + (w ? ' disabled' : '') + '>' + v + '</button>';
      });
    } else if (P.phase === 'end') {
      html = '<button type="button" class="next" id="nextBtn">Дальше</button>';
    }
    $('choices').innerHTML = html;

    var eq = '', box = '<span class="box' + (P.fill != null ? ' filled' : '') + '">' + (P.fill != null ? '<span>' + P.fill + '</span>' : '') + '</span>';
    var op = function (s) { return '<span class="op">' + s + '</span>'; };
    if (P.phase === 2) eq = '<span class="' + k(I.bi) + '">' + I.big + '</span>' + op('+') + box + op('=') + '<span>10</span>';
    else if (P.phase === '3r') eq = '<span class="' + k(I.si) + '">' + I.small + '</span>' + op('−') + '<span class="gr">' + I.need + '</span>' + op('=') + box;
    else if (P.phase === 4) eq = '<span>10</span>' + op('+') + '<span>' + I.rem + '</span>' + op('=') + box;
    $('eq').innerHTML = eq;
    $('eq').hidden = !eq;

    var old = document.querySelector('.nline'); if (old) old.remove();
    if (P.phase === 'end') $('frames').insertAdjacentHTML('afterend', numberLine(I));
  }

  function render() {
    var done = S.i >= S.queue.length;
    $('game').hidden = done; $('done').hidden = !done;
    $('game').style.display = done ? 'none' : 'flex';
    $('count').textContent = Math.min(S.i + 1, S.queue.length) + ' / ' + S.queue.length;
    $('soundBtn').setAttribute('aria-pressed', String(S.sound));
    if (done) { showDone(); return; }
    renderSteps(); renderRecord(); renderFrames(); renderBottom();
  }

  function showDone() {
    var orig = S.queue.filter(function (x) { return !x.retry; });
    var good = orig.filter(function (x) { return !x.missed; }).length, h = '';
    for (var i = 0; i < orig.length; i++) h += '<span class="star' + (i < good ? ' on' : '') + '" style="animation-delay:' + (i * 90) + 'ms">★</span>';
    $('stars').innerHTML = h;
    $('doneTitle').textContent = good >= 7 ? 'Отлично!' : good >= 5 ? 'Хорошо!' : 'Почти получилось!';
    $('doneText').textContent = good + ' из ' + orig.length + ' примеров без ошибок. ' +
      (good >= 7 ? 'Попробуй решать в уме, а потом проверяй кружками.' : 'Сыграем ещё раз, и будет лучше.');
    if (good >= 5) { tone(523, .15); tone(659, .15, 'sine', .15); tone(784, .3, 'sine', .3); }
  }

  /* ---------- actions ---------- */

  function setPhase(ph, msg) { P.phase = ph; P.opts = null; P.wrong = {}; P.msg = msg || null; P.cls = msg ? 'good' : ''; render(); if (msg) setTimeout(function () { if (P.phase === ph) { P.msg = null; P.cls = ''; renderBottom(); } }, 1300); }

  function miss(key, text) { q().missed = true; P.wrong[key] = true; P.msg = text; P.cls = 'bad'; buzz(); renderBottom(); }

  function pickBig(i) {
    var n = nums();
    if (n[i] >= n[1 - i]) {
      P.big = i; ding();
      setPhase(2, n[0] === n[1] ? 'Числа равные, можно взять любое.' : 'Да! ' + n[i] + ' больше.');
    } else miss('b' + i, 'Посчитай кружки: где их больше?');
  }

  function solved(v, ph, msg) {
    P.lock = true; P.fill = v; P.msg = null; P.cls = '';
    renderBottom();
    var btns = $('choices').querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
    setTimeout(function () { P.lock = false; P.fill = null; setPhase(ph, msg); }, 750);
  }

  function pickValue(v) {
    if (P.lock) return;
    var I = info();
    if (P.phase === 2) {
      if (v === I.need) { ding(); solved(v, '3m', I.big + ' и ' + I.need + ' — это 10.'); }
      else miss('v' + v, 'Посчитай пустые зелёные клетки у ' + I.big + '.');
    } else if (P.phase === '3r') {
      if (v === I.rem) { ding(); solved(v, 4, 'Верно, осталось ' + I.rem + '.'); }
      else miss('v' + v, 'Посчитай кружки, которые остались внизу.');
    } else if (P.phase === 4) {
      if (v === I.sum) { tone(523, .12); tone(659, .12, 'sine', .1); tone(784, .25, 'sine', .2); solved(v, 'end', 'Молодец! ' + I.big + ' + ' + I.small + ' = ' + I.sum); }
      else miss('v' + v, 'Начни с 10 и считай дальше: 11, 12…');
    }
  }

  function moveOne() {
    var I = info();
    if (P.phase !== '3m' || P.moved >= I.need) return;
    P.moved++; P.flash = true; tone(500 + P.moved * 70, .1);
    if (P.moved === I.need) { setPhase('3r', 'Десяток полный!'); }
    else { renderFrames(); }
  }

  function next() {
    var cur = q();
    if (cur.missed && !cur.retry) S.queue.push({ a: cur.a, b: cur.b, retry: true });
    S.i++;
    if (S.i < S.queue.length) startProblem(); else render();
  }

  function bind() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest('button'); if (!t) return;
      if (t.hasAttribute('data-big')) pickBig(Number(t.getAttribute('data-big')));
      else if (t.hasAttribute('data-v')) pickValue(Number(t.getAttribute('data-v')));
      else if (t.hasAttribute('data-move')) moveOne();
      else if (t.id === 'nextBtn') next();
      else if (t.id === 'again') { newRound(); startProblem(); }
      else if (t.id === 'soundBtn') {
        S.sound = !S.sound; t.setAttribute('aria-pressed', String(S.sound));
        try { localStorage.setItem('cd-sound', S.sound ? '1' : '0'); } catch (err) {}
        tone(660, .1);
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && P && P.phase === 'end') next();
    });
  }

  function start(data) {
    try { var s = localStorage.getItem('cd-sound'); if (s !== null) S.sound = s === '1'; } catch (e) {}
    if (data && data.queue && data.queue.length) { S.queue = data.queue; S.i = data.i || 0; }
    else newRound();
    bind();
    if (S.i < S.queue.length) startProblem(); else render();
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      window.claude.hot.snapshot(function () { return { queue: S.queue, i: S.i }; });
    }
  }

  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start(window.claude && window.claude.hot ? window.claude.hot.data : null);
})();
</script>
</body>
</html>
